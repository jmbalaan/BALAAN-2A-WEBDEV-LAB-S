<!DOCTYPE html>
<html>
<head>
<title>My Diary Display</title>
</head>
<body>

    <div style="border: 1px solid #888; width: 320px; height: 500px; background-color: white;">
        
        <div style="border-bottom: 1px solid #888; padding: 2px 5px; font-family: sans-serif; font-size: 12px;">
            Split A
        </div>

        <div style="padding: 15px; font-family: 'Times New Roman', serif;">
            
            <h1 style="color: black; margin-top: 10px;">My Diary</h1>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Date:</label>
                <input type="date" style="font-family: inherit;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">How are you feeling?</label>
                <input type="text" style="width: 200px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Entry:</label>
                <input type="text" style="width: 200px;">
            </div>

            <button style="margin-bottom: 20px; font-family: inherit; cursor: pointer;">Submit</button>

            <h2 style="color: black;">Diary Entry</h2>

        </div>
    </div>

</body>
</html>
